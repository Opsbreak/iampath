# GoReleaser configuration (https://goreleaser.com). Not wired into CI yet;
# run locally with `goreleaser release --snapshot --clean` to test.
version: 2

project_name: iampath

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: iampath
    main: ./cmd/iampath
    binary: iampath
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/Opsbreak/iampath/internal/version.Version={{ .Version }}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: default
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  use: github
  sort: asc
